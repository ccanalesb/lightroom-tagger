# Contract drift gate — install into .github/workflows/ by a maintainer.
# Do NOT commit this file under .github/workflows/ from the sandcastle agent
# (GitHub App pushes are rejected for workflow files).

name: Contract drift gate

on:
  pull_request:
    paths:
      - 'apps/visualizer/**'
      - 'docs/adr/**'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/visualizer/backend/requirements.txt
          pip install -e .

      - name: Install frontend dependencies
        working-directory: apps/visualizer/frontend
        run: npm ci --legacy-peer-deps

      - name: Regenerate OpenAPI types and fail on drift
        working-directory: apps/visualizer/frontend
        run: |
          npm run generate:api
          git diff --exit-code src/types/api.gen.ts

      - name: Typecheck frontend
        working-directory: apps/visualizer/frontend
        run: npx tsc --noEmit

      # tsc proves the types line up; it does not prove the UI still behaves.
      # Added while removing surfaces from the frontend (map #218) -- those
      # slices are almost entirely frontend, and without this the only gate on
      # them was a typecheck.
      - name: Frontend tests
        working-directory: apps/visualizer/frontend
        run: npx vitest run --retry=2

      # Scope: all migrated contract groups (V1–V7). The list lives in
      # apps/visualizer/backend/tests/contract-tests.txt -- edit that file, never
      # this one and never .github/workflows/**, which a GitHub App cannot push.
      - name: Backend contract tests (spectree response validation, migrated groups)
        working-directory: apps/visualizer/backend
        run: |
          grep -vE '^\s*(#|$)' tests/contract-tests.txt | xargs python -m pytest -q
